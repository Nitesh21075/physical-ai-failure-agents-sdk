[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-failure-harness"
version = "0.1.0"
description = "Research harness for rare environmental failure scenarios in physical AI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "Pillow>=10",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
research = [
    "openai>=1.0",
    "openai-agents>=0.4",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx2>=0.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
